name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version du manifest = tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/cantine_eda/manifest.json > m.json
          mv m.json custom_components/cantine_eda/manifest.json
          sed -i "s/const CARD_VERSION = \".*\"/const CARD_VERSION = \"$VERSION\"/" custom_components/cantine_eda/frontend/cantine-eda-card.js
      - name: Archive
        run: cd custom_components/cantine_eda && zip -r ../../cantine_eda.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: cantine_eda.zip
